# Base SST: apps/api (PostgreSQL, migrations, Mailpit) + apps/web (Next.js).
#
# Primeira vez, na pasta apps/api/: cp .env.example .env (defina POSTGRES_PASSWORD) e
# python -m backend.scripts.generate_keys. Depois:
#   docker compose -f deploy/docker/docker-compose.dev.yml up -d --build
# Web: http://localhost:3000 | API: http://localhost:8010 | Mailpit: http://localhost:8025

include:
  - path: ../../apps/api/docker-compose.yml
    env_file: ../../apps/api/.env

services:
  web:
    build:
      context: ../../apps/web
      # Os rewrites do Next são fixados no build: o endereço interno da API entra aqui.
      args:
        AUTH_INTERNAL_URL: http://auth-service:8000
        AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8010}
        AUTH_AUDIENCE: ${AUTH_AUDIENCE:-knowledge-api}
        AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-__Host-kb_at}
    environment:
      AUTH_INTERNAL_URL: http://auth-service:8000
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8010}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-knowledge-api}
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-__Host-kb_at}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped
