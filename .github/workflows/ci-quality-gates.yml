name: CI BaseCore

on:
  push:
    branches: [main, master]
    paths:
      - 'BaseCore/**'
      - '.github/workflows/ci-quality-gates.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'BaseCore/**'
      - '.github/workflows/ci-quality-gates.yml'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Executar a suíte E2E (Playwright)'
        type: boolean
        default: false

# Monorepo: tudo roda na pasta da Base (BaseCore/).
defaults:
  run:
    working-directory: BaseCore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BaseCore/package-lock.json

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários com cobertura
        run: npm run test:coverage

      - name: Build de produção
        run: npm run build

  security:
    name: Dependências e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BaseCore/package-lock.json

      - run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Verificação básica de segredos (padrões conhecidos)
        run: |
          if grep -rEn "(BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{50,})" src scripts ../.github; then
            echo "Possível segredo versionado encontrado."
            exit 1
          fi

  # Os testes E2E atuais dependem de comportamento ainda não implementado
  # (proteção do /admin, snapshots visuais sem baseline). Rodam só sob demanda
  # até serem reescritos contra o stack real (Next + API + PostgreSQL).
  e2e:
    name: E2E (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BaseCore/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: BaseCore/playwright-report/
          retention-days: 14
