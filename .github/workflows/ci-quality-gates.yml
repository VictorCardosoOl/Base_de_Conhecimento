name: Quality Gates & CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality Gate 1: Verificação Estática, Tipagem e Testes de Unidade
  quality-gate-unit:
    name: 🧪 Unit Tests & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript Shift-Left)
        run: npx tsc --noEmit

      - name: Content CI (Markdownlint & Formatting Validation)
        run: |
          npm run lint:md || true
          npm run format:check || true

      - name: Run Unit Tests with Coverage Thresholds
        run: npm run test:coverage

      - name: Build Production Artifacts
        run: npm run build

  # Quality Gate 2: Testes E2E e Smoke Tests
  quality-gate-e2e:
    name: 🎭 E2E & Smoke Verification
    needs: quality-gate-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E, Visual & A11y Tests
        run: npm run test:e2e

      - name: Verify Service Worker & Static Outputs
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          echo "✅ Production artifacts and PWA outputs validated."

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Quality Gate 3: Análise Estática de Segurança (SAST) e Dependências
  quality-gate-security:
    name: 🛡️ Security & Vulnerability Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit (Shift-Left Security)
        run: npm audit --audit-level=high

      - name: Static Security & Secret Scanning (TruffleHog / GitGuardian SAST equivalent)
        run: |
          echo "🔍 Executando inspeção de segurança estática no repositório..."
          # Bloqueia se encontrar chaves privadas ou tokens em arquivos rastreados
          ! grep -rE "(BEGIN PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36})" src/

  # Quality Gate 4: Performance Budgets com Lighthouse CI
  quality-gate-performance:
    name: ⚡ Lighthouse CI & Web Vitals Budgets
    needs: quality-gate-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application for Audit
        run: npm run build

      - name: Run Lighthouse CI with Strict Budgets (FCP & CLS)
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

